name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore acceptance test tools
      run: dotnet restore SoftwareDeploymentProject.E2E/SoftwareDeploymentProject.E2E.csproj --locked-mode

    - name: Install Chromium and system dependencies
      run: dotnet run --project SoftwareDeploymentProject.E2E --no-restore -- install --with-deps chromium

    - name: Test and publish application
      run: bash scripts/verify.sh --browser

    - name: Upload test evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-evidence
        path: .artifacts/

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: publish/**

  create-image:
    # PRs verify application changes; only merged/pushed master builds publish images.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Download build artifact
      uses: actions/download-artifact@v7
      with:
        name: build
        path: build

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
      
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: SoftwareDeploymentProject.dockerfile
        push: true
        tags: |
          977456087342.dkr.ecr.ap-southeast-2.amazonaws.com/swe40006-tues1030-g03/softwaredeploymentproject:latest
          ghcr.io/swe40006-tues1030-g03/softwaredeploymentproject:latest