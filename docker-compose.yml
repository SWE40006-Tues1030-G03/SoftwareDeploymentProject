
services:
  shopping-cart:
    build:
      context: ./SoftwareDeploymentProject
      dockerfile: ../SoftwareDeploymentProject.dockerfile

    image: shopping-cart

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

    restart: unless-stopped

